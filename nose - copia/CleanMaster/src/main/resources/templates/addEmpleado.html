<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agregar Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
   <h2>Agregar Empleado a Cliente</h2>
    <form th:action="@{/addEmpleado/{id}(id=${cliente.codigo})}" method="post">
        <div class="form-group">
            <label for="empleadoId">Empleado:</label>
            <select id="empleadoId" name="empleadoId" class="form-control">
                <option th:each="empleado : ${empleados}" th:value="${empleado.codigo}" th:text="${empleado.nombre}">Empleado</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Agregar Empleado</button>
    </form>
</div>
</body>
</html>
