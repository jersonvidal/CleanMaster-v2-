<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h2 class="my-4">Listado de Clientes</h2>
        
        <!-- Mostrar un mensaje en caso de error -->
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <!-- Tabla para mostrar los clientes -->
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Fecha</th>
                    <th>Tipo de Servicio</th>
                    <th>Empleado</th> 
                    <th>Acciones</th> 

            </thead>
            <tbody>
                <!-- Iterar sobre la lista de clientes -->
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.codigo}">1</td>
                    <td th:text="${cliente.dni}">12345678</td>
                    <td th:text="${cliente.nombre}">John Doe</td>
                    <td th:text="${cliente.correo}">johndoe@email.com</td>
                    <td th:text="${cliente.telefono}">987654321</td>
                    <td th:text="${cliente.fechaFormateada}">Fecha no disponible</td>
    			    <td th:text="${cliente.tipoServicio != null ? cliente.tipoServicio.nomTipo : 'N/A'}">Tipo de Servicio</td>
                    <td th:text="${cliente.empleado != null ? cliente.empleado.nombre : 'N/A'}">Empleado 1</td>
            	  <td>
               	 <a th:href="@{/addEmpleado/{id}(id=${cliente.codigo})}" class="btn btn-success">Añadir Empleado</a>
            	</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
